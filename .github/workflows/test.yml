name: Test
on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Dependency security audit
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const vulnerabilities = report.vulnerabilities || {};
          const entries = Object.entries(vulnerabilities);
          console.log("Dependency audit summary:", JSON.stringify(report.metadata?.vulnerabilities || {}));
          if (!entries.length) console.log("No known vulnerabilities reported by npm audit.");
          for (const [name, item] of entries) {
            const via = (item.via || []).map(v => typeof v === "string" ? v : v.title || v.name || "advisory").join("; ");
            console.log(`- ${name}: severity=${item.severity}; range=${item.range}; fixAvailable=${JSON.stringify(item.fixAvailable)}; via=${via}`);
          }
          NODE
      - run: npm test
